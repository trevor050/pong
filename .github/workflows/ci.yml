name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests, physics regression and service worker version check
        run: npm run check
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

  macos-saver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build EndlessPong.saver
        run: ./macos/build.sh
      - name: Load the bundle and run the web app inside it
        run: swift macos/smoke-test.swift
